# ====================================================================
# Jekyll configuration file for VarAtoZ theme
# ====================================================================
title: NoWisdomS # 网站标题（显示在浏览器标签和SEO中）
author:
    name: NoVarYe
    email: jidijam.olk@outlook.com
lang: en # 默认语言（en=英语，zh-CN=中文）
favicon: /favicon.ico # 网站图标（favicon）
# Change to your timezone › https://kevinnovak.github.io/Time-Zone-Picker
timezone: Asia/Shanghai

# 网站描述（SEO关键字段，显示在搜索引擎结果中）
# "欢迎漫步于我的博客天地，这里融合了科技的前沿、生活的智慧与旅行的奇遇。
# 探索每一篇文章，品味独特见解，从中汲取灵感与智慧，为你的生活增添色彩。"
description: >-
    "Welcome to the world of my blog, where the cutting edge of technology, 
    the wisdom of daily life, and the wonders of travel come together. 
    Explore each article, savor unique insights, 
    and draw inspiration and wisdom to add color to your life."

# the avatar on sidebar, support local or CORS resources
avatar: /assets/avatars/avatar.jpg

# ====================================================================
# Site settings
# 站点URL与构建配置
# domain: No4Var2Ye.github.io
# ====================================================================
url: https://No4Var2Ye.github.io
baseurl: ""
feed:
    path: "feed.xml"

# 启用的Jekyll插件列表（需在Gemfile中先安装）
plugins:
    - jekyll-feed
    # - jekyll-remote-theme # 远程加载主题
    - tzinfo-data
    - jekyll-seo-tag
    - jekyll-paginate
    - jekyll-sitemap # 生成sitemap.xml
    - jekyll-spaceship

# ====================================================================
# Theme settings
# theme: varatoZ
# remote_theme: No4Var2Ye/VarAtoZ
theme: varatoz
# ====================================================================

sass:
    style: compressed

# ====================================================================
# Web Analytics Settings
# ====================================================================
analytics:
    google:
        id: G-MRH0X2Y200
    goatcounter:
        id: # fill in your GoatCounter ID
    umami:
        id: # fill in your Umami ID
        domain: # fill in your Umami domain
    matomo:
        id: # fill in your Matomo ID
        domain: # fill in your Matomo domain

google_analytics: G-MRH0X2Y200

disqus:
    shortname: novarye

comments:
    # Global switch for the post comment system. Keeping it empty means disabled.
    provider: giscus
    # The provider options are as follows:
    disqus:
        shortname: novarye
    # utterances settings › https://utteranc.es/
    utterances:
        repo: # <gh-username>/<repo>
        issue_term: # < url | pathname | title | ...>
    # Giscus options › https://giscus.app
    giscus:
        repo: No4Var2Ye/no4var2ye.github.io # <gh-username>/<repo>
        repo_id: R_kgDOK9xKpw
        category: Comments
        category_id: DIC_kwDOK9xKp84CcIV2
        mapping: pathname # optional, default to 'pathname'
        input_position: bottom # optional, default to 'bottom'
        lang: site.lang # optional, default to the value of `site.lang`
        reactions_enabled: 1 # optional, default to the value of `1`

# TODO: Pagination settings
paginate: 30

# Collection settings
# TODO: Add your collections here.
collections:
    academic:
        output: true
        permalink: /academic/:path/
    design:
        output: true
        permalink: /design/:path/
    development:
        output: true
        permalink: /development/:path/
    # lifestyle:
    #     output: true
    #     permalink: /lifestyle/:path/

# ====================================================================
# GitHub Pages settings
# ====================================================================
github: [metadata]
lsi: false
safe: true
incremental: false
highlighter: rouge
gist:
    noscript: false
kramdown:
    math_engine: mathjax
    # parse_block_html: true
    syntax_highlighter: rouge
    # parse_span_html: true
    syntax_highlighter_opts: # Rouge Options › https://github.com/jneen/rouge#full-options
        css_class: highlight
        # default_lang: console
        span:
            line_numbers: false
        block:
            line_numbers: true
            start_line: 1

# Markdown settings
markdown: kramdown

# Post settings
excerpt_separator: "<!--more-->"

# Theme-specific settings

coolblack: #090a0b
spacegrey: #353535
snowwhite: #ffffff
#
theme_color: snowwhite
#
# Custom color as below:
# theme_color: "#882250"

# You can choose a brand color
# Default brand colors as below:
orangered: #ff5100
greatgold: #f2cb05
greenblue: #389092
#
brand_color: orangered
#
# Custom color as below:
# brand_color: "#1a8e42"

# You can custom selection style
# selection:
#   color: "#ff00ff"
#   background_color: "yellow"

# Night/Dark mode
# Default mode is "auto", "auto" is for auto nightshift
# (19:00 - 07:00), "manual" is for manual toggle, and
# "on/off" is for default on/off.
#
# Whatever the user's choice is, it will supersede the
# default setting of the site and be kept during the
# visit (session). Only the dark mode setting is"manual",
# it will be always kept on every visit (i.e. no matter
# the browser is closed or not)
#
night_mode: "manual"

# Code badge setting
# You can enable or disable the code badge and so on
# code_badge:
#   enabled: "true"
#   color: "#fff"
#   background_color: "#ff4e00"
#   text_transform: "uppercase"  # ("uppercase", "lowercase", "capitalize")

# If you want to link only specific pages in your header, use this and add the path to the pages
# in order as they should show up.
# TODO: Add the pages you want to show up in the header.
header_pages:
  - index.html
  - archives.html
  - categories.html
  - tags.html
  - about.html

# TODO: Set to `true` to show excerpts on the homepage.
# Excerpt settings
excerpt:
  default_image: /assets/images/default-image.jpeg  # Default image when the image style is not none
  image_style: z          # Image layout style (It's value could be none, left, right, top, z, z-reverse)
  image_width: 38.2%      # Image default width
  image_height: 160px     # Image default height
  text_size: 350          # Words default size

# Photo previewer settings (PhotoSwipe 5)
# the options please refer to: https://photoswipe.com/options/
photo_previewer:
 gallery: "section.main"
 children: "a.photo-swipe"
 bgOpacity: 0.8
 padding:
   top: 20
   bottom: 40
   left: 100
   right: 100

# Click to top settings
click_to_top:
  light:
    background_color: "white"
    color: "#454545"
  dark:
    background_color: "#34323d"
    color: "#bbb"

